# Variabilele ${...} sunt citite automat din backend/.env
# (copiază backend/.env.example în backend/.env la prima rulare).
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER lipsește din backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD lipsește din backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB lipsește din backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      # Cheia verificată de nodul „Verificare X-API-Key” prin {{ $env.N8N_API_KEY }}
      - N8N_API_KEY=${N8N_API_KEY:?N8N_API_KEY lipsește din backend/.env}
      # Cheia Gemini pentru Smart Digest (rezumat + idei cheie + etichete) și „Aprofundează”
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Domeniul Clerk (Frontend API): n8n verifică token-ul Google la https://<domeniu>/oauth/userinfo
      - CLERK_DOMAIN=${CLERK_DOMAIN:?CLERK_DOMAIN lipsește din backend/.env}
      # Permite expresiilor din workflow-uri să citească $env (implicit blocat în versiunile noi)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  postgres_data:
  n8n_data:
